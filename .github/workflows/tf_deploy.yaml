name: deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  lint-test:
    name: "Lint and Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init Dev
        run: |
          cd environments/dev
          rm -f .terraform.lock.hcl
          sed -i '/provider "aws"/,$d' main.tf
          terraform init -backend=false

      - name: Terraform Validate Dev
        run: terraform -chdir=environments/dev validate

      - name: Terraform Init Staging
        run: |
          cd environments/stag
          rm -f .terraform.lock.hcl
          sed -i '/provider "aws"/,$d' main.tf
          terraform init -backend=false

      - name: Terraform Validate Staging
        run: terraform -chdir=environments/stag validate

      - name: Terraform Init Prod
        run: |
          cd environments/prod
          rm -f .terraform.lock.hcl
          sed -i '/provider "aws"/,$d' main.tf
          terraform init -backend=false

      - name: Terraform Validate Prod
        run: terraform -chdir=environments/prod validate

  deploy-dev:
    name: "Deploy on dev"
    needs: "lint-test"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mask Role ARN
        run: |
          ROLE_ARN="${{ secrets.AWS_ROLE_DEV }}"
          echo "::add-mask::$ROLE_ARN"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEV }}
          aws-region: eu-central-1
          mask-aws-account-id: 'true'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply
        run: |
          cd environments/dev
          terraform init
          terraform apply -auto-approve

  deploy-staging:
    name: "Deploy on staging"
    needs: "deploy-dev"
    runs-on: ubuntu-latest
    environment: stag
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mask Role ARN
        run: |
          ROLE_ARN="${{ secrets.AWS_ROLE_STAG }}"
          echo "::add-mask::$ROLE_ARN"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STAG }}
          aws-region: eu-central-1
          mask-aws-account-id: 'true'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply
        run: |
          cd environments/stag
          terraform init
          terraform apply -auto-approve

  deploy-prod:
    name: "Deploy on prod"
    needs: "deploy-staging"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mask Role ARN
        run: |
          ROLE_ARN="${{ secrets.AWS_ROLE_PROD }}"
          echo "::add-mask::$ROLE_ARN"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PROD }}
          aws-region: eu-central-1
          mask-aws-account-id: 'true'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply
        run: |
          cd environments/prod
          terraform init
          terraform apply -auto-approve
