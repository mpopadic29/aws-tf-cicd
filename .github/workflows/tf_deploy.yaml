name: deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  lint-test:
    name: "lint and test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  deploy-dev:
    name: "Deploy on dev"
    needs: "lint-test"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC claims          # <-- NOVO
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0)%4) $0=$0"="; print }' | base64 -d | jq '{iss, aud, sub, repository}'

      - name: Mask Role ARN
        run: |
          ROLE_ARN="${{ secrets.AWS_ROLE_DEV }}"
          echo "::add-mask::$ROLE_ARN"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEV }}
          aws-region: eu-central-1
          role-session-name: GitHubActionsDevSession
          mask-aws-account-id: 'true'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Terraform Apply
        run: |
          cd environments/dev
          terraform init
          terraform apply -auto-approve

  deploy-staging:
    name: "Deploy on staging"
    needs: "deploy-dev"
    runs-on: ubuntu-latest
    environment: stag
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mask Role ARN
        run: |
          ROLE_ARN="${{ secrets.AWS_ROLE_STAG }}"
          echo "::add-mask::$ROLE_ARN"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STAG }}
          aws-region: eu-central-1
          mask-aws-account-id: 'true'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Terraform Apply
        run: |
          cd environments/stag
          terraform init
          terraform apply -auto-approve

  deploy-prod:
    name: "Deploy on prod"
    needs: "deploy-staging"
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mask Role ARN
        run: |
          ROLE_ARN="${{ secrets.AWS_ROLE_PROD }}"
          echo "::add-mask::$ROLE_ARN"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PROD }}
          aws-region: eu-central-1
          mask-aws-account-id: 'true'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Terraform Apply
        run: |
          cd environments/prod
          terraform init
          terraform apply -auto-approve
